<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Навчальні події{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">EduEvents</a>
  <nav>
    <a href="{{ url_for('home') }}">Головна</a>
    <a href="{{ url_for('event_list') }}">Події</a>
    <a href="{{ url_for('register') }}">Реєстрація</a>
  </nav>
</header>
<main class="container">
  {% with notices = get_flashed_messages(with_categories=true) %}
    {% if notices %}
      {% for category, message in notices %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Навчальний проєкт · {{ year }}</footer>
</body>
</html>
