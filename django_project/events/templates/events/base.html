{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Навчальні події{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{% url 'home' %}">EduEvents</a>
  <nav>
    <a href="{% url 'home' %}">Головна</a>
    <a href="{% url 'events' %}">Події</a>
    <a href="{% url 'register' %}">Реєстрація</a>
  </nav>
</header>
<main class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="flash {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer>Навчальний проєкт · {{ year|default:"2026" }}</footer>
</body>
</html>
